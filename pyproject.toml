[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "consultdeck"
version = "0.1.0"
description = "Local CLI pipeline for semi-automated consulting deck generation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "filelock>=3.13",
    "httpx>=0.27",
    "pydantic>=2.6",
    "python-pptx>=0.6.23",
    "PyYAML>=6.0",
]

[project.scripts]
consultdeck = "consultdeck.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=consultdeck",
    "--cov-report=term-missing",
]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["consultdeck"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.hatch.build.targets.wheel]
packages = ["src/consultdeck"]

[tool.hatch.build.targets.sdist]
include = [
    "src/consultdeck",
    "assets/templates",
    "docs",
    "README.md",
    "pyproject.toml",
]
